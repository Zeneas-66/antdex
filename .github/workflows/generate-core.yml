name: AntDex generate core data

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-antwiki-core.mjs'
      - '.github/workflows/generate-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate static AntWiki core data
        run: node tools/generate-antwiki-core.mjs
      - name: Commit generated core
        run: |
          git add data/generated-core.js data/generated-core-report.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update generated AntWiki core data [skip ci]'
          git push
