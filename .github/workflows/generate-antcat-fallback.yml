name: AntDex AntCat fallback

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-antcat-fallback.mjs'
      - '.github/workflows/generate-antcat-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate AntCat fallback batch
        run: node tools/generate-antcat-fallback.mjs
      - name: Commit fallback batch
        run: |
          git add data/verified-batch-13.js data/antcat-fallback-report.json
          if git diff --cached --quiet; then
            echo 'No fallback changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add AntCat fallback core data [skip ci]'
          git push
